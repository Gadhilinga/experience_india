name: experience_india
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.1.1
  cloud_firestore: ^6.6.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0
  carousel_slider: ^5.1.1
  image_picker: ^1.1.2
  get: ^4.7.3
  device_preview: ^1.2.0
  http: ^1.6.0
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/destinations-backup.json

